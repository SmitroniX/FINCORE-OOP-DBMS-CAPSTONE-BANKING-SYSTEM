# Database Configuration for FinCore Capstone Project
# Supported types: sqlite (zero configuration embedded) or mysql (external server)

db.type=sqlite

# SQLite Configuration (Default: Local file database)
sqlite.url=jdbc:sqlite:fincore_banking.db

# MySQL Configuration (To use MySQL, change db.type=mysql and update credentials)
mysql.url=jdbc:mysql://localhost:3306/fincore_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
mysql.user=root
mysql.password=
