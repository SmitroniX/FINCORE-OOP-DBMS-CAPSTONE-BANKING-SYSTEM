# ====================================================================
# FinCore Database Configuration
# Supported types: oracle (Oracle 10g XE / Enterprise), sqlite (zero-config embedded default), mysql
# ====================================================================

db.type=sqlite

# --- Oracle 10g XE Configuration ---
# Standard Oracle 10g XE SID is 'xe' or 'XE', listening on port 1521
oracle.driver=oracle.jdbc.OracleDriver
oracle.url=jdbc:oracle:thin:@localhost:1521:xe
oracle.user=system
oracle.password=oracle

# --- SQLite Configuration (Zero-configuration local embedded file) ---
sqlite.url=jdbc:sqlite:fincore_banking.db

# --- MySQL Configuration ---
mysql.url=jdbc:mysql://localhost:3306/fincore_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
mysql.user=root
mysql.password=
