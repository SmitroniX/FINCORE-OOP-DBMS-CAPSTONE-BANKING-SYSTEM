# ====================================================================
# FinCore Database Configuration
# Primary DBMS Engine: Oracle Database (XE / Free in Docker)
# Supported types: oracle (default), sqlite (fallback), mysql
# ====================================================================

db.type=oracle

# --- Oracle Database Configuration (Docker: gvenzl/oracle-free:23-slim) ---
oracle.driver=oracle.jdbc.OracleDriver
oracle.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
oracle.user=fincore_user
oracle.password=fincore_pass
oracle.fallback.sqlite=true

# --- Alternative Classic Oracle XE Connection Settings ---
oracle.alt.url=jdbc:oracle:thin:@localhost:1521:xe
oracle.alt.user=system
oracle.alt.password=oracle

# --- SQLite Configuration (Zero-Config Offline Fallback Engine) ---
sqlite.url=jdbc:sqlite:fincore_banking.db

# --- MySQL Configuration ---
mysql.url=jdbc:mysql://localhost:3306/fincore_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
mysql.user=root
mysql.password=
